<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: black;
      touch-action: none;
    }
    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw;
      max-height: 100vh;
      z-index: 0;
    }
  </style>

  <div class="fixed text-white text-sm ml-2 mt-1 select-none">
    <p class="text-sky-500 dark:text-sky-400">Jeshi la Mzalendo</p>
    <span>Shujaa Points: </span><span id="scoreEl">0</span>
  </div>

  <div class="fixed inset-0 flex items-center justify-center z-20" id="modalEl" style="pointer-events: auto;">
    <div class="bg-white max-w-md w-full p-6 text-center" style="pointer-events: auto;">
      <h1 class="text-4xl font-bold leading-none" id="bigScoreEl">0</h1>
      <p class="text-sm text-gray-700 mb-0">Shujaa Score</p>
      <p class="mb-0 text-lg font-medium">
        Hongera Mzalendo! Kenya yakushukuru!
      </p>
      <div class="space-y-2">
        <div class="mb-2 flex items-center justify-center">
          <label for="soundToggle" class="text-gray-700 text-sm font-bold mr-2">Sauti:</label>
          <button id="soundToggle" class="bg-gray-200 text-gray-800 px-3 py-1 rounded-full text-sm font-semibold transition hover:bg-gray-300">Washa</button>
        </div>
        <div class="mb-2">
          <label class="block text-gray-700 text-sm font-bold mb-1">Ugumu:</label>
          <select id="difficultySelect" class="w-full py-2 px-3 rounded bg-gray-100 text-gray-800">
            <option value="easy">Rahisi</option>
            <option value="normal" selected>Kawaida</option>
            <option value="hard">Ngumu</option>
          </select>
        </div>
        <button
          class="bg-blue-500 text-white w-full py-3 rounded-full text-sm mb-2"
          id="startGameButton"
        >
          Start Game
        </button>
        <button
          class="bg-red-500 text-white w-full py-3 rounded-full text-sm"
          id="quitGameButton"
        >
          Quit Game
        </button>
      </div>
    </div>
  </div> <div class="fixed bottom-4 right-4 z-30 flex items-center space-x-2" id="inGameSoundToggleContainer" style="display:none;">
    <button id="inGameSoundToggle" class="bg-gray-800 text-white px-3 py-2 rounded-full text-sm font-semibold shadow transition hover:bg-gray-700">Sauti: Washa</button>
  </div>
  <canvas></canvas>

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/gsap.min.js"
    integrity="sha512-VEBjfxWUOyzl0bAwh4gdLEaQyDYPvLrZql3pw1ifgb6fhEvZl9iDDehwHZ+dsMzA0Jfww8Xt7COSZuJ/slxc4Q=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./index.js"></script>
</body>
